# KRX workstation starting profile: Ryzen 9 5900X / 64 GiB RAM / local SSD.
# Merge these values into the active postgresql.conf, then restart PostgreSQL.
# Keep synchronous_commit and fsync enabled: this database is durable research data.

max_connections = 80
shared_buffers = 8GB
effective_cache_size = 32GB
work_mem = 16MB
maintenance_work_mem = 1GB

max_worker_processes = 12
max_parallel_workers = 10
max_parallel_workers_per_gather = 6
max_parallel_maintenance_workers = 4

random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200
jit = off

checkpoint_completion_target = 0.9
min_wal_size = 2GB
max_wal_size = 8GB
wal_compression = on

autovacuum = on
track_io_timing = on
log_min_duration_statement = 5000
timezone = 'Asia/Seoul'
