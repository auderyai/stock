name: Stock daily DB update to Google Drive

on:
  schedule:
    - cron: "37 20 * * 1-5"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      target_date:
        description: "거래일(YYYY-MM-DD), 비우면 한국 현재 날짜"
        required: false
        type: string
      stage:
        description: "독립 실행 단계"
        required: false
        default: "menu2"
        type: choice
        options:
          - menu2
          - menu5
          - menu7
          - remaining

concurrency:
  group: stock-daily-google-drive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: krx_research
          POSTGRES_USER: stock_worker
          POSTGRES_PASSWORD: worker_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_worker -d krx_research"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stock_worker:worker_ephemeral_password@127.0.0.1:5432/krx_research
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      DRIVE_ARCHIVE_KEY: ${{ secrets.DRIVE_ARCHIVE_KEY }}
      LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
      LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
      KRX_XING_FALLBACK: "0"
      PYTHONUTF8: "1"
      TZ: "Asia/Seoul"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-cloud-worker.txt
      - name: Run and persist one database stage
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.target_date }}" ]]; then
            args+=(--date "${{ inputs.target_date }}")
          fi
          if [[ -n "${{ inputs.stage }}" ]]; then
            args+=(--stage "${{ inputs.stage }}")
          fi
          python scripts/stock_drive_sync.py cloud-run "${args[@]}"
