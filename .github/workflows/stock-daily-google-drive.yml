name: Stock daily DB update to Google Drive

on:
  schedule:
    - cron: "37 20 * * 1-5"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      target_date:
        description: "거래일(YYYY-MM-DD), 비우면 한국 현재 날짜"
        required: false
        type: string
      stage:
        description: "독립 실행 단계"
        required: false
        default: "menu2"
        type: choice
        options:
          - menu2
          - menu5
          - menu7
          - remaining

concurrency:
  group: stock-daily-google-drive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  manual-menu2:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'menu2'
    uses: ./.github/workflows/stock-drive-stage.yml
    with:
      target_date: ${{ inputs.target_date }}
      stage: menu2
    secrets: inherit

  manual-menu5:
    needs: manual-menu2
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (inputs.stage == 'menu5' ||
      (inputs.stage == 'menu2' && needs.manual-menu2.result == 'success'))
    uses: ./.github/workflows/stock-drive-stage.yml
    with:
      target_date: ${{ inputs.target_date }}
      stage: menu5
    secrets: inherit

  manual-menu7:
    needs: [manual-menu2, manual-menu5]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (inputs.stage == 'menu7' ||
      (inputs.stage != 'menu7' && needs.manual-menu5.result == 'success'))
    uses: ./.github/workflows/stock-drive-stage.yml
    with:
      target_date: ${{ inputs.target_date }}
      stage: menu7
    secrets: inherit

  manual-remaining:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'remaining'
    uses: ./.github/workflows/stock-drive-stage.yml
    with:
      target_date: ${{ inputs.target_date }}
      stage: remaining
    secrets: inherit

  scheduled-menu2:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/stock-drive-stage.yml
    with:
      stage: menu2
    secrets: inherit

  scheduled-menu5:
    needs: scheduled-menu2
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/stock-drive-stage.yml
    with:
      stage: menu5
    secrets: inherit

  scheduled-menu7:
    needs: scheduled-menu5
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/stock-drive-stage.yml
    with:
      stage: menu7
    secrets: inherit
