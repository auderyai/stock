name: Stock daily DB update to Google Drive

on:
  schedule:
    # GitHub cron is UTC. The second trigger covers a delayed/dropped first event;
    # checkpointed stages make the duplicate invocation idempotent.
    - cron: "37 11 * * 1-5"
    - cron: "17 12 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "거래일(YYYY-MM-DD), 비우면 한국 현재 날짜"
        required: false
        type: string
      stage:
        description: "클라우드 실행 시작 단계"
        required: false
        default: "menu5"
        type: choice
        options:
          - menu5
          - menu7

concurrency:
  group: stock-daily-google-drive
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  manual-menu5:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'menu5'
    uses: ./.github/workflows/stock-drive-stage.yml
    with:
      target_date: ${{ inputs.target_date }}
      stage: menu5
    secrets: inherit

  manual-menu7:
    needs: manual-menu5
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (inputs.stage == 'menu7' ||
      (needs.manual-menu5.result == 'success' &&
      needs.manual-menu5.outputs.proceed == 'true'))
    uses: ./.github/workflows/stock-drive-stage.yml
    with:
      target_date: ${{ inputs.target_date }}
      stage: menu7
    secrets: inherit

  scheduled-menu5:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/stock-drive-stage.yml
    with:
      stage: menu5
    secrets: inherit

  scheduled-menu7:
    needs: scheduled-menu5
    if: >-
      github.event_name == 'schedule' &&
      needs.scheduled-menu5.result == 'success' &&
      needs.scheduled-menu5.outputs.proceed == 'true'
    uses: ./.github/workflows/stock-drive-stage.yml
    with:
      stage: menu7
    secrets: inherit
