name: Stock Drive checkpointed stage

on:
  workflow_call:
    inputs:
      target_date:
        description: "거래일(YYYY-MM-DD), 비우면 한국 현재 날짜"
        required: false
        default: ""
        type: string
      stage:
        description: "클라우드 실행 단계(menu5 또는 menu7)"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: krx_research
          POSTGRES_USER: stock_worker
          POSTGRES_PASSWORD: worker_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_worker -d krx_research"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stock_worker:worker_ephemeral_password@127.0.0.1:5432/krx_research
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      DRIVE_ARCHIVE_KEY: ${{ secrets.DRIVE_ARCHIVE_KEY }}
      LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
      LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
      KRX_XING_FALLBACK: "0"
      PYTHONUTF8: "1"
      TZ: "Asia/Seoul"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-cloud-worker.txt
      - name: Run and persist one database stage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stage="${{ inputs.stage }}"
          if [[ "$stage" != "menu5" && "$stage" != "menu7" ]]; then
            echo "::error::지원하지 않는 클라우드 단계: $stage"
            exit 64
          fi
          args=(--stage "$stage")
          if [[ -n "${{ inputs.target_date }}" ]]; then
            args+=(--date "${{ inputs.target_date }}")
          fi
          output_file=$(mktemp)
          set +e
          python scripts/stock_drive_sync.py cloud-run "${args[@]}" 2>&1 | tee "$output_file"
          code=${PIPESTATUS[0]}
          set -e
          output=$(<"$output_file")
          rm -f "$output_file"
          if [[ $code -eq 75 ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Stock Drive 공급원·네트워크 오류: ${{ inputs.target_date || 'KST today' }}" \
              --body "정해진 2회 재시도 후에도 일시 오류가 계속되었습니다. 완료 데이터와 체크포인트는 보존했습니다. 실행: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit "$code"
          fi
          if [[ $code -ne 0 ]]; then
            exit "$code"
          fi
