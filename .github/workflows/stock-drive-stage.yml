name: Stock Drive checkpointed stage

on:
  workflow_call:
    inputs:
      target_date:
        description: "거래일(YYYY-MM-DD), 비우면 한국 현재 날짜"
        required: false
        default: ""
        type: string
      stage:
        description: "클라우드 실행 단계(menu5 또는 menu7)"
        required: true
        type: string
    outputs:
      proceed:
        description: "다음 단계를 실행해도 되는지 여부"
        value: ${{ jobs.update.outputs.proceed }}

permissions:
  contents: read
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      proceed: ${{ steps.result.outputs.proceed }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: krx_research
          POSTGRES_USER: stock_worker
          POSTGRES_PASSWORD: worker_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_worker -d krx_research"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stock_worker:worker_ephemeral_password@127.0.0.1:5432/krx_research
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      DRIVE_ARCHIVE_KEY: ${{ secrets.DRIVE_ARCHIVE_KEY }}
      LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
      LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
      KRX_XING_FALLBACK: "0"
      PYTHONUTF8: "1"
      TZ: "Asia/Seoul"
    steps:
      - uses: actions/checkout@v4
      - name: Record recovery context
        env:
          REQUESTED_DATE: ${{ inputs.target_date }}
          STAGE: ${{ inputs.stage }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          target_date="$REQUESTED_DATE"
          if [[ -z "$target_date" ]]; then
            current_hhmm=$(date +%H%M)
            if (( 10#$current_hhmm >= 2010 )); then
              target_date=$(date +%F)
            else
              target_date=$(date -d yesterday +%F)
            fi
          fi
          TARGET_DATE="$target_date" python - <<'PY'
          import json, os
          with open("stock-drive-recovery-context.json", "w", encoding="utf-8") as handle:
              json.dump({
                  "target_date": os.environ["TARGET_DATE"],
                  "stage": os.environ["STAGE"],
                  "run_id": os.environ["RUN_ID"],
                  "run_url": os.environ["RUN_URL"],
                  "head_sha": os.environ["HEAD_SHA"],
              }, handle, ensure_ascii=False)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-cloud-worker.txt
      - name: Run and persist one database stage
        id: run
        shell: bash
        run: |
          stage="${{ inputs.stage }}"
          if [[ "$stage" != "menu5" && "$stage" != "menu7" ]]; then
            echo "::error::지원하지 않는 클라우드 단계: $stage"
            exit 64
          fi
          args=(--stage "$stage")
          if [[ -n "${{ inputs.target_date }}" ]]; then
            args+=(--date "${{ inputs.target_date }}")
          fi
          output_file=$(mktemp)
          set +e
          python scripts/stock_drive_sync.py cloud-run "${args[@]}" 2>&1 | tee "$output_file"
          code=${PIPESTATUS[0]}
          set -e
          output=$(<"$output_file")
          rm -f "$output_file"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Classify result
        id: result
        if: always()
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: |
          if [[ "$CODE" == "0" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report exhausted provider retries
        if: steps.run.outputs.code == '75'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Stock Drive 공급원·네트워크 오류: ${{ inputs.target_date || 'KST 자동 기준일' }}" \
            --body "정해진 2회 재시도 후에도 공급원 오류가 계속되었습니다. 완료 데이터와 체크포인트는 보존했으며 Codex 자동 수정은 호출하지 않습니다. 실행: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          exit 75
      - name: Fail on actual code error
        if: steps.run.outputs.code != '0' && steps.run.outputs.code != '75'
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: exit "$CODE"
      - name: Preserve code failure context
        if: always() && steps.run.outputs.code != '0' && steps.run.outputs.code != '75'
        uses: actions/upload-artifact@v4
        with:
          name: stock-drive-code-failure-context-${{ github.run_id }}
          path: stock-drive-recovery-context.json
          if-no-files-found: error
          retention-days: 7
