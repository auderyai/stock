name: Stock menu 5 OpenDART financial backfill

on:
  schedule:
    # One report period per day; the next year waits for local verification.
    - cron: "23 15 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "사업연도(비우면 다음 허용 연도)"
        required: false
        type: string
      batch_size:
        description: "암호화 체크포인트당 회사 수"
        required: false
        default: "100"
        type: string

concurrency:
  group: stock-menu5-opendart-financial
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  menu5-opendart-financial:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: krx_research
          POSTGRES_USER: stock_worker
          POSTGRES_PASSWORD: worker_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_worker -d krx_research"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stock_worker:worker_ephemeral_password@127.0.0.1:5432/krx_research
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      DRIVE_ARCHIVE_KEY: ${{ secrets.DRIVE_ARCHIVE_KEY }}
      PYTHONUTF8: "1"
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-cloud-worker.txt
      - name: Collect next validated menu 5 financial period
        shell: bash
        run: |
          args=(--years 2026,2025,2024,2023 cloud-menu5 --batch-size "${{ inputs.batch_size || '100' }}")
          if [[ -n "${{ inputs.year }}" ]]; then
            args+=(--year "${{ inputs.year }}")
          fi
          python scripts/opendart_financial_backfill.py "${args[@]}"
