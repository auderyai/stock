name: Stock Drive automatic repair

on:
  workflow_run:
    workflows: ["Stock daily DB update to Google Drive"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: stock-drive-automatic-repair
  cancel-in-progress: false

jobs:
  signal:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      issue: ${{ steps.issue.outputs.number }}
    steps:
      - name: Create code failure issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Stock Drive 코드 오류: run $RUN_ID" \
            --body "실제 코드 오류가 감지되어 Codex 자동 수정·검증·재개를 시작합니다. 완료 데이터와 체크포인트는 보존합니다. 실행 로그: $RUN_URL")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

  repair:
    needs: signal
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 50
          persist-credentials: false
      - name: Download trusted failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir recovery failed-run-logs
          gh run download "$RUN_ID" \
            --name "stock-drive-code-failure-context-$RUN_ID" \
            --dir recovery
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/logs" > failed-run.zip
          unzip -q failed-run.zip -d failed-run-logs
      - name: Validate recovery target
        id: context
        run: |
          target_date=$(python -c 'import json; print(json.load(open("recovery/stock-drive-recovery-context.json", encoding="utf-8"))["target_date"])')
          stage=$(python -c 'import json; print(json.load(open("recovery/stock-drive-recovery-context.json", encoding="utf-8"))["stage"])')
          [[ "$target_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$stage" == "menu5" || "$stage" == "menu7" ]]
          attempts=$(git log -50 --format=%s | grep -F -c "fix(stock-drive): auto-recover $target_date $stage" || true)
          if (( attempts >= 2 )); then
            echo "자동 수정 2회 제한에 도달했습니다: $target_date $stage" >&2
            exit 78
          fi
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repair validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-cloud-worker.txt
      - name: Run Codex for the minimal repair
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/stock-drive-failure.md
          output-file: codex-output.md
          permission-profile: ":workspace"
          allow-bots: true
      - name: Remove diagnostic inputs before validation
        if: always()
        run: rm -rf failed-run.zip failed-run-logs recovery codex-output.md
      - name: Validate the bounded repair
        run: python scripts/validate_stock_drive_repair.py
      - name: Commit and push verified repair
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
          STAGE: ${{ steps.context.outputs.stage }}
        run: |
          git config user.name "stock-drive-repair[bot]"
          git config user.email "stock-drive-repair[bot]@users.noreply.github.com"
          git add -- requirements-cloud-worker.txt \
            scripts/stock_drive_sync.py scripts/run_cloud_xing_stage.py \
            src/krx_research/application/xing_db \
            src/krx_research/cloud_sync \
            src/krx_research/infrastructure/xing_db \
            tests/application/test_xing_db_menu5_retry.py \
            tests/application/test_xing_db_menu7_retry.py tests/cloud_sync
          git commit -m "fix(stock-drive): auto-recover $TARGET_DATE $STAGE"
          gh auth setup-git
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resume from the saved checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
          STAGE: ${{ steps.context.outputs.stage }}
        run: |
          gh workflow run stock-daily-google-drive.yml --ref main \
            -f target_date="$TARGET_DATE" -f stage="$STAGE"
      - name: Report automatic recovery
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.signal.outputs.issue }}
          COMMIT: ${{ steps.push.outputs.commit }}
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
          STAGE: ${{ steps.context.outputs.stage }}
          DIAGNOSIS: ${{ steps.codex.outputs.final-message }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Codex가 제한된 Stock Drive 범위의 수정과 검증을 완료했습니다. 커밋: $COMMIT. $TARGET_DATE $STAGE 작업을 저장된 체크포인트부터 다시 실행했습니다.\n\n$DIAGNOSIS"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
      - name: Report unresolved automatic repair
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.signal.outputs.issue }}
          REPAIR_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "자동 수정 또는 검증을 안전하게 완료하지 못해 재실행하지 않았습니다. 완료 데이터와 체크포인트는 유지되어 있습니다. 사용자 확인이 필요한 복구 실행: $REPAIR_URL"
